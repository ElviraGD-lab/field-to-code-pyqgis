name: Deploy book to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block Cyrillic text
        run: |
          if git ls-files -z | xargs -0 perl -CSD -ne 'if (/[\x{0400}-\x{04FF}]/) { print "$ARGV:$.: $_"; $found = 1 } close ARGV if eof; END { exit($found ? 1 : 0) }'; then
            echo "No Cyrillic text in the repository."
          else
            echo "Cyrillic text found. Russian drafts stay in field-to-code-pyqgis-ru."
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install MyST
        run: npm install -g mystmd@1.12.0
      - name: Build HTML
        working-directory: book
        run: myst build --html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: book/_build/html
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
